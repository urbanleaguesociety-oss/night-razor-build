<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Night Razor: Pearl City Brawlers</title>
  <script src="https://tailwindcss.com"></script>
  <style>
        #root .pointer-events-none.z-30 > div:first-child { position: relative; width: 132px; height: 132px; display: flex; align-items: center; justify-content: center; }
    #root .pointer-events-none.z-30 > div:first-child > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    #root .pointer-events-none.z-30 > div:first-child > div { position: absolute; width: 60px; height: 60px; }
    #root .pointer-events-none.z-30 > div:last-child { position: relative; width: 164px; height: 164px; }
    #root .pointer-events-none.z-30 > div:last-child > div { position: absolute; width: 58px; height: 58px; }
    #root .pointer-events-none.z-30 > div:last-child > div:nth-child(1) { top: 0; left: 53px; }
    #root .pointer-events-none.z-30 > div:last-child > div:nth-child(2) { left: 0; top: 53px; }
    #root .pointer-events-none.z-30 > div:last-child > div:nth-child(3) { right: 0; top: 53px; }
    #root .pointer-events-none.z-30 > div:last-child > div:nth-child(4) { bottom: 0; left: 53px; }
    #root .pointer-events-none.z-30 button { width: 100%; height: 100%; background: transparent; border: none; padding: 0; }
    #root .pointer-events-none.z-30 button img { width: 100%; height: 100%; object-fit: contain; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #root {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #020617;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #root > div {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020617;
    }
    #root header {
      width: 100%;
      height: 52px;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(6, 182, 212, 0.35);
      z-index: 20;
    }
    #root header + div {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }
    #root canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .hidden { display: none !important; }
    .fixed { position: fixed; }
    .absolute { position: absolute; }
    .relative { position: relative; }
    .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .items-end { align-items: flex-end; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .justify-end { justify-content: flex-end; }
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    .pointer-events-none { pointer-events: none; }
    .pointer-events-auto { pointer-events: auto; }
    .z-20 { z-index: 20; }
    .z-30 { z-index: 30; }
    .z-40 { z-index: 40; }
    .z-50 { z-index: 50; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
