<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Night Razor: Pearl City Brawlers</title>
  <script src="https://tailwindcss.com"></script>
  <style>
                      #mobile-touch-controls {
      position: fixed !important;
      inset: 0 !important;
      pointer-events: none !important;
      z-index: 50 !important;
      display: flex !important;
      justify-content: space-between !important;
      align-items: flex-end !important;
      padding: 12px 12px 22px 12px !important;
    }

    /* Left 8-Way Arcade Joystick */
    #mobile-touch-controls [aria-label="Arcade 8-Way Joystick"] {
      position: relative !important;
      width: 132px !important;
      height: 132px !important;
      margin-bottom: 12px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      pointer-events: auto !important;
      touch-action: none !important;
    }
    #mobile-touch-controls [aria-label="Arcade 8-Way Joystick"] > div {
      position: absolute !important;
      width: 52px !important;
      height: 52px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    /* Right S / J / P / K Tight Diamond Cluster (targets both outer & inner wrappers) */
    #mobile-touch-controls > div:last-child,
    #mobile-touch-controls > div:last-child > div {
      position: relative !important;
      width: 146px !important;
      height: 146px !important;
      min-width: 146px !important;
      max-width: 146px !important;
      min-height: 146px !important;
      max-height: 146px !important;
      margin-bottom: 6px !important;
      margin-right: 4px !important;
      pointer-events: none !important;
    }
    #mobile-touch-controls > div:last-child button {
      position: absolute !important;
      width: 48px !important;
      height: 48px !important;
      pointer-events: auto !important;
      touch-action: none !important;
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    /* Explicit pixel diamond coordinates inside 146x146 box */
    #mobile-touch-controls > div:last-child button:nth-of-type(1) { top: 0px !important; left: 49px !important; transform: none !important; }
    #mobile-touch-controls > div:last-child button:nth-of-type(2) { top: 49px !important; left: 0px !important; transform: none !important; }
    #mobile-touch-controls > div:last-child button:nth-of-type(3) { top: 49px !important; right: 0px !important; left: auto !important; transform: none !important; }
    #mobile-touch-controls > div:last-child button:nth-of-type(4) { bottom: 0px !important; top: auto !important; left: 49px !important; transform: none !important; }

    #mobile-touch-controls svg,
    #mobile-touch-controls img {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
    }



    *, *::before, *::after { box-sizing: border-box; }
    html, body, #root {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #020617;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #root > div {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020617;
    }
    #root header {
      width: 100%;
      height: 52px;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(6, 182, 212, 0.35);
      z-index: 20;
    }
    #root header + div {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }
    #root canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .hidden { display: none !important; }
    .fixed { position: fixed; }
    .absolute { position: absolute; }
    .relative { position: relative; }
    .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .items-end { align-items: flex-end; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .justify-end { justify-content: flex-end; }
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    .pointer-events-none { pointer-events: none; }
    .pointer-events-auto { pointer-events: auto; }
    .z-20 { z-index: 20; }
    .z-30 { z-index: 30; }
    .z-40 { z-index: 40; }
    .z-50 { z-index: 50; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
