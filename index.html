<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Night Razor: Pearl City Brawlers</title>
  <script src="https://tailwindcss.com"></script>
  <style>
                              #mobile-touch-controls {
      position: fixed !important;
      inset: 0 !important;
      pointer-events: none !important;
      z-index: 50 !important;
      display: flex !important;
      justify-content: space-between !important;
      align-items: flex-end !important;
      padding: 14px 14px 20px 14px !important;
    }
    #mobile-touch-controls [aria-label="Arcade 8-Way Joystick"] {
      position: relative !important;
      width: 136px !important;
      height: 136px !important;
      margin-bottom: 10px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      pointer-events: auto !important;
      touch-action: none !important;
    }
    #mobile-touch-controls [aria-label="Arcade 8-Way Joystick"] > div {
      position: absolute !important;
      width: 54px !important;
      height: 54px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    #mobile-touch-controls > div:last-child > div > div {
      position: relative !important;
      width: 100% !important;
      height: 100% !important;
    }
    #mobile-touch-controls button {
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    #mobile-touch-controls svg,
    #mobile-touch-controls img {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
    }



    *, *::before, *::after { box-sizing: border-box; }
    html, body, #root {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #020617;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #root > div {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020617;
    }
       #root header + div {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }
    #root header + div > div:first-child {
      position: relative !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      overflow: hidden !important;
      height: calc(100vh - 52px) !important;
      width: calc((100vh - 52px) * 4 / 3) !important;
      max-width: 100vw !important;
      max-height: calc(100vh - 52px) !important;
    }
    #root canvas {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: fill !important;
      display: block !important;
    }
    .hidden { display: none !important; }
    .fixed { position: fixed; }
    .absolute { position: absolute; }
    .relative { position: relative; }
    .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .items-end { align-items: flex-end; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .justify-end { justify-content: flex-end; }
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    .pointer-events-none { pointer-events: none; }
    .pointer-events-auto { pointer-events: auto; }
    .z-20 { z-index: 20; }
    .z-30 { z-index: 30; }
    .z-40 { z-index: 40; }
    .z-50 { z-index: 50; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
