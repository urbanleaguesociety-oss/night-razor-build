<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Night Razor: Pearl City Brawlers</title>
  <script src="https://tailwindcss.com"></script>
  <style>
              #mobile-touch-controls {
      position: fixed !important;
      inset: 0 !important;
      pointer-events: none !important;
      z-index: 50 !important;
      display: flex !important;
      justify-content: space-between !important;
      align-items: flex-end !important;
      padding: 16px 20px !important;
    }
    #mobile-touch-controls > div {
      position: relative !important;
      flex-shrink: 0 !important;
    }
    /* Joystick outer ring (w-36 h-36) & inner ball (w-14 h-14) */
    #mobile-touch-controls [aria-label="Arcade 8-Way Joystick"] {
      position: relative !important;
      width: 144px !important;
      height: 144px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      pointer-events: auto !important;
      touch-action: none !important;
    }
    #mobile-touch-controls [aria-label="Arcade 8-Way Joystick"] > div {
      position: absolute !important;
      width: 58px !important;
      height: 58px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    /* 4 Diamond Buttons container (w-40 h-40) */
    #mobile-touch-controls > div:last-child {
      width: 168px !important;
      height: 168px !important;
      pointer-events: none !important;
    }
    #mobile-touch-controls > div:last-child button {
      position: absolute !important;
      width: 58px !important;
      height: 58px !important;
      pointer-events: auto !important;
      touch-action: none !important;
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    #mobile-touch-controls .top-0 { top: 0 !important; }
    #mobile-touch-controls .bottom-0 { bottom: 0 !important; }
    #mobile-touch-controls .left-0 { left: 0 !important; }
    #mobile-touch-controls .right-0 { right: 0 !important; }
    #mobile-touch-controls .left-1\/2 { left: 50% !important; transform: translateX(-50%) !important; }
    #mobile-touch-controls .top-1\/2 { top: 50% !important; transform: translateY(-50%) !important; }
    #mobile-touch-controls svg,
    #mobile-touch-controls img {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body, #root {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #020617;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #root > div {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020617;
    }
    #root header {
      width: 100%;
      height: 52px;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(6, 182, 212, 0.35);
      z-index: 20;
    }
    #root header + div {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }
    #root canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .hidden { display: none !important; }
    .fixed { position: fixed; }
    .absolute { position: absolute; }
    .relative { position: relative; }
    .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .items-end { align-items: flex-end; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .justify-end { justify-content: flex-end; }
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    .pointer-events-none { pointer-events: none; }
    .pointer-events-auto { pointer-events: auto; }
    .z-20 { z-index: 20; }
    .z-30 { z-index: 30; }
    .z-40 { z-index: 40; }
    .z-50 { z-index: 50; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
